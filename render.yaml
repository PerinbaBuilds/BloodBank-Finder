services:
  - type: web
    name: bloodbank-finder-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bloodbank-finder-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: http://localhost:3000
      - key: DEFAULT_MATCH_RADIUS_KM
        value: "15"
      - key: MIN_DONATION_INTERVAL_DAYS
        value: "90"

databases:
  - name: bloodbank-finder-db
    plan: free
